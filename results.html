<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Résultats — Sondage PI Planning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface-hover: #222633;
            --border: #2a2e3d;
            --text: #e8e9ed;
            --text-muted: #8b8fa3;
            --accent: #6c5ce7;
            --accent-light: #a29bfe;
            --accent-glow: rgba(108, 92, 231, 0.15);
            --success: #00cec9;
            --warning: #fdcb6e;
            --danger: #e17055;
            --info: #74b9ff;
            --radius: 12px;
            --radius-sm: 8px;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px 80px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 48px;
        }
        .header .tag {
            display: inline-block;
            background: var(--accent-glow);
            border: 1px solid rgba(108, 92, 231, 0.3);
            color: var(--accent-light);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 16px;
        }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--text) 0%, var(--accent-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .header p { color: var(--text-muted); }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent-light);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 24px;
            transition: opacity 0.2s;
        }
        .back-link:hover { opacity: 0.8; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            margin-bottom: 32px;
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .card-subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 24px;
        }

        .stat-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }
        .stat-item {
            background: var(--surface-hover);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px 24px;
            flex: 1;
            min-width: 140px;
            text-align: center;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-light);
        }
        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Matrix table for Q1 */
        .matrix-wrapper { overflow-x: auto; }
        table.matrix {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        table.matrix th, table.matrix td {
            padding: 10px 14px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }
        table.matrix th {
            background: var(--surface-hover);
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
        }
        table.matrix th:first-child, table.matrix td:first-child {
            text-align: left;
            font-weight: 600;
            color: var(--text);
            position: sticky;
            left: 0;
            background: var(--surface);
            z-index: 1;
        }
        table.matrix th:first-child {
            background: var(--surface-hover);
            z-index: 2;
        }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-active { background: rgba(0,206,201,0.15); color: var(--success); }
        .badge-follow { background: rgba(116,185,255,0.15); color: var(--info); }
        .badge-none { background: rgba(139,143,163,0.1); color: var(--text-muted); }

        /* Chart containers */
        .chart-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        .chart-box {
            background: var(--surface-hover);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 20px;
            position: relative;
        }
        .chart-box canvas { max-height: 320px; }
        .chart-box h4 {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-muted);
        }

        /* Priority ranking */
        .rank-list { list-style: none; counter-reset: rank; }
        .rank-item {
            counter-increment: rank;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            margin-bottom: 6px;
            background: var(--surface-hover);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }
        .rank-item::before {
            content: counter(rank);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 0.8rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        .rank-item:nth-child(1)::before { background: #fdcb6e; color: #2d3436; }
        .rank-item:nth-child(2)::before { background: #b2bec3; color: #2d3436; }
        .rank-item:nth-child(3)::before { background: #e17055; color: #fff; }
        .rank-item:nth-child(n+4)::before { background: var(--border); color: var(--text-muted); }
        .rank-label { flex: 1; font-weight: 500; }
        .rank-score {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .no-data {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
            font-style: italic;
        }

        .refresh-btn {
            background: var(--surface-hover);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
        }
        .refresh-btn:hover { background: var(--border); }

        @media (max-width: 768px) {
            .chart-row { grid-template-columns: 1fr; }
            .container { padding: 24px 16px 60px; }
            .header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">← Retour au sondage</a>

    <div class="header">
        <div class="tag">Résultats</div>
        <h1>Vue d'ensemble</h1>
        <p>Données agrégées de toutes les réponses</p>
        <br>
        <button class="refresh-btn" onclick="loadResults()">🔄 Rafraîchir les données</button>
    </div>

    <div class="stat-bar" id="statBar"></div>

    <div id="content">
        <div class="no-data">Chargement des résultats…</div>
    </div>
</div>

<script>
    // Chart.js global config for dark theme
    Chart.defaults.color = '#8b8fa3';
    Chart.defaults.borderColor = '#2a2e3d';
    Chart.defaults.font.family = 'DM Sans, sans-serif';

    const COLORS = {
        purple: '#6c5ce7',
        purpleLight: '#a29bfe',
        teal: '#00cec9',
        blue: '#74b9ff',
        yellow: '#fdcb6e',
        orange: '#e17055',
        pink: '#fd79a8',
        green: '#00b894',
        grey: '#636e72',
    };
    const PALETTE = [COLORS.purple, COLORS.teal, COLORS.yellow, COLORS.orange, COLORS.blue, COLORS.pink, COLORS.green, COLORS.purpleLight, COLORS.grey];

    async function loadResults() {
        try {
            const res = await fetch('api.php?action=results');
            const data = await res.json();
            render(data);
        } catch (e) {
            document.getElementById('content').innerHTML = '<div class="no-data">Erreur de chargement. Vérifiez que le serveur PHP est lancé.</div>';
        }
    }

    function render(data) {
        const { respondents, subjects, q1, q2, q3, q4, q5 } = data;

        if (respondents.length === 0) {
            document.getElementById('statBar').innerHTML = '';
            document.getElementById('content').innerHTML = '<div class="no-data">Aucune réponse pour le moment. Revenez après que des participants aient répondu au sondage.</div>';
            return;
        }

        // Stats
        document.getElementById('statBar').innerHTML = `
            <div class="stat-item"><div class="stat-value">${respondents.length}</div><div class="stat-label">Participants</div></div>
            <div class="stat-item"><div class="stat-value">${subjects.length}</div><div class="stat-label">Sujets</div></div>
        `;

        let html = '';

        // ===== Q1: Matrix table =====
        html += `<div class="card">
            <div class="card-title">Q1 — Contribution par sujet</div>
            <div class="card-subtitle">Qui a travaillé sur quoi pendant le PI précédent</div>
            <div class="matrix-wrapper"><table class="matrix"><thead><tr><th>Participant</th>`;
        subjects.forEach(s => html += `<th>${esc(s)}</th>`);
        html += '</tr></thead><tbody>';

        const q1Map = {};
        q1.forEach(r => {
            if (!q1Map[r.pseudo]) q1Map[r.pseudo] = {};
            q1Map[r.pseudo][r.subject_name] = r.level;
        });

        respondents.forEach(r => {
            html += `<tr><td>${esc(r.pseudo)}</td>`;
            subjects.forEach(s => {
                const val = q1Map[r.pseudo]?.[s] || '—';
                let cls = 'badge-none';
                if (val === 'contribué activement') cls = 'badge-active';
                else if (val === 'suivi le sujet') cls = 'badge-follow';
                html += `<td><span class="badge ${cls}">${esc(val)}</span></td>`;
            });
            html += '</tr>';
        });

        // Aggregation row
        html += `<tr style="border-top:2px solid var(--border)"><td style="font-weight:700;color:var(--accent-light)">TOTAL actifs</td>`;
        subjects.forEach(s => {
            const count = q1.filter(r => r.subject_name === s && r.level === 'contribué activement').length;
            html += `<td><strong style="color:var(--success)">${count}</strong> / ${respondents.length}</td>`;
        });
        html += '</tr>';

        html += '</tbody></table></div></div>';

        // ===== Q1 Chart: stacked bar =====
        html += `<div class="card">
            <div class="card-title">Q1 — Répartition des contributions</div>
            <div class="card-subtitle">Vue graphique par sujet</div>
            <div style="max-width:700px;margin:0 auto;"><canvas id="q1Chart"></canvas></div>
        </div>`;

        // ===== Q2: Priority ranking =====
        html += `<div class="card">
            <div class="card-title">Q2 — Classement de priorité</div>
            <div class="card-subtitle">Rang moyen (1 = plus prioritaire). Plus le score est bas, plus le sujet est jugé prioritaire.</div>`;

        const q2Map = {};
        q2.forEach(r => {
            if (!q2Map[r.subject_name]) q2Map[r.subject_name] = [];
            q2Map[r.subject_name].push(r.rank);
        });

        const q2Sorted = subjects.map(s => ({
            name: s,
            avg: q2Map[s] ? (q2Map[s].reduce((a, b) => a + b, 0) / q2Map[s].length) : 999,
            votes: q2Map[s] ? q2Map[s].length : 0
        })).sort((a, b) => a.avg - b.avg);

        html += '<ol class="rank-list">';
        q2Sorted.forEach(item => {
            html += `<li class="rank-item">
                <span class="rank-label">${esc(item.name)}</span>
                <span class="rank-score">Rang moyen : ${item.avg.toFixed(1)} (${item.votes} votes)</span>
            </li>`;
        });
        html += '</ol></div>';

        // ===== Q3: Vision — horizontal stacked bars =====
        html += `<div class="card">
            <div class="card-title">Q3 — Niveau de vision par sujet</div>
            <div class="card-subtitle">Comment les participants perçoivent leur visibilité</div>
            <div style="max-width:700px;margin:0 auto;"><canvas id="q3Chart"></canvas></div>
        </div>`;

        // ===== Q4: Confidence — horizontal stacked bars =====
        html += `<div class="card">
            <div class="card-title">Q4 — Niveau de confiance par sujet</div>
            <div class="card-subtitle">Confiance dans la réussite de chaque sujet</div>
            <div style="max-width:700px;margin:0 auto;"><canvas id="q4Chart"></canvas></div>
        </div>`;

        // ===== Q5: Workload — doughnut =====
        html += `<div class="card">
            <div class="card-title">Q5 — Charge de travail</div>
            <div class="card-subtitle">Ressenti global de l'équipe sur la charge</div>
            <div class="chart-row">
                <div class="chart-box"><canvas id="q5Chart"></canvas></div>
                <div class="chart-box" id="q5Detail"><h4>Détail par participant</h4></div>
            </div>
        </div>`;

        document.getElementById('content').innerHTML = html;

        // Now render charts
        renderQ1Chart(subjects, q1, respondents);
        renderQ3Chart(subjects, q3);
        renderQ4Chart(subjects, q4);
        renderQ5Chart(q5);
    }

    function renderQ1Chart(subjects, q1Data, respondents) {
        const levels = ['contribué activement', 'suivi le sujet', 'pas travaillé dessus'];
        const colors = [COLORS.teal, COLORS.blue, COLORS.grey];

        const datasets = levels.map((lvl, i) => ({
            label: lvl,
            data: subjects.map(s => q1Data.filter(r => r.subject_name === s && r.level === lvl).length),
            backgroundColor: colors[i],
            borderRadius: 4,
        }));

        new Chart(document.getElementById('q1Chart'), {
            type: 'bar',
            data: { labels: subjects, datasets },
            options: {
                indexAxis: 'y',
                responsive: true,
                plugins: {
                    legend: { position: 'bottom', labels: { padding: 16, usePointStyle: true, pointStyle: 'rectRounded' } },
                },
                scales: {
                    x: { stacked: true, grid: { color: 'rgba(42,46,61,0.5)' }, ticks: { stepSize: 1 } },
                    y: { stacked: true, grid: { display: false } }
                }
            }
        });
    }

    function renderQ3Chart(subjects, q3Data) {
        const levels = ['super claire', 'bien mais avec des zones de flou', 'très flou', 'de quoi on parle ?'];
        const colors = [COLORS.teal, COLORS.blue, COLORS.yellow, COLORS.orange];

        const datasets = levels.map((lvl, i) => ({
            label: lvl,
            data: subjects.map(s => q3Data.filter(r => r.subject_name === s && r.level === lvl).length),
            backgroundColor: colors[i],
            borderRadius: 4,
        }));

        new Chart(document.getElementById('q3Chart'), {
            type: 'bar',
            data: { labels: subjects, datasets },
            options: {
                indexAxis: 'y',
                responsive: true,
                plugins: {
                    legend: { position: 'bottom', labels: { padding: 16, usePointStyle: true, pointStyle: 'rectRounded' } },
                },
                scales: {
                    x: { stacked: true, grid: { color: 'rgba(42,46,61,0.5)' }, ticks: { stepSize: 1 } },
                    y: { stacked: true, grid: { display: false } }
                }
            }
        });
    }

    function renderQ4Chart(subjects, q4Data) {
        const levels = [
            'on va réussir',
            'on va réussir partiellement ou on sera en retard',
            'on va échouer',
            'je connais pas le sujet, ne se prononce pas',
            'je connais le sujet mais je me prononce pas car trop d\'incertitude'
        ];
        const shortLabels = ['Réussir', 'Partiellement/Retard', 'Échouer', 'Ne connaît pas', 'Trop d\'incertitude'];
        const colors = [COLORS.teal, COLORS.yellow, COLORS.orange, COLORS.grey, COLORS.pink];

        const datasets = levels.map((lvl, i) => ({
            label: shortLabels[i],
            data: subjects.map(s => q4Data.filter(r => r.subject_name === s && r.level === lvl).length),
            backgroundColor: colors[i],
            borderRadius: 4,
        }));

        new Chart(document.getElementById('q4Chart'), {
            type: 'bar',
            data: { labels: subjects, datasets },
            options: {
                indexAxis: 'y',
                responsive: true,
                plugins: {
                    legend: { position: 'bottom', labels: { padding: 12, usePointStyle: true, pointStyle: 'rectRounded', font: { size: 11 } } },
                },
                scales: {
                    x: { stacked: true, grid: { color: 'rgba(42,46,61,0.5)' }, ticks: { stepSize: 1 } },
                    y: { stacked: true, grid: { display: false } }
                }
            }
        });
    }

    function renderQ5Chart(q5Data) {
        const labels = [
            "J'ai trop de travail par rapport à ma capacité, je suis débordé",
            "J'ai juste ce qu'il faut",
            "J'ai pas assez de travail, je m'ennuie"
        ];
        const shortLabels = ['🔥 Débordé', '✅ Juste bien', '💤 Pas assez'];
        const colors = [COLORS.orange, COLORS.teal, COLORS.blue];

        const counts = labels.map(l => q5Data.filter(r => r.level === l).length);

        new Chart(document.getElementById('q5Chart'), {
            type: 'doughnut',
            data: {
                labels: shortLabels,
                datasets: [{
                    data: counts,
                    backgroundColor: colors,
                    borderColor: '#1a1d27',
                    borderWidth: 3,
                    hoverOffset: 8,
                }]
            },
            options: {
                responsive: true,
                cutout: '55%',
                plugins: {
                    legend: { position: 'bottom', labels: { padding: 16, usePointStyle: true, pointStyle: 'circle' } },
                }
            }
        });

        // Detail list
        const detail = document.getElementById('q5Detail');
        q5Data.forEach(r => {
            let emoji = '✅';
            if (r.level.includes('trop')) emoji = '🔥';
            else if (r.level.includes('ennuie')) emoji = '💤';
            detail.innerHTML += `<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:0.85rem;">
                <strong>${esc(r.pseudo)}</strong> <span style="color:var(--text-muted);margin-left:8px;">${emoji} ${esc(r.level)}</span>
            </div>`;
        });
    }

    function esc(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    loadResults();
</script>
</body>
</html>
